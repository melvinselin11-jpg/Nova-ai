<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova AI</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
               "Segoe UI", sans-serif;
  background: #080a0f;
  color: #f5f5f7;
  height: 100vh;
  overflow: hidden;
}

.app {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */

.header {
  height: 62px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  border-bottom: 1px solid #20232b;
  background: rgba(8,10,15,.92);
  backdrop-filter: blur(20px);
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 20px;
  font-weight: 700;
}

.logo-icon {
  width: 34px;
  height: 34px;
  border-radius: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg,#7c5cff,#36a3ff);
  font-weight: 800;
}

.new-chat {
  border: 1px solid #30343e;
  background: #151820;
  color: white;
  padding: 9px 14px;
  border-radius: 12px;
  font-size: 14px;
}

/* CHAT */

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 25px 16px 130px;
}

.message {
  max-width: 760px;
  margin: 0 auto 24px;
  display: flex;
  gap: 12px;
}

.avatar {
  width: 32px;
  height: 32px;
  min-width: 32px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
}

.ai-avatar {
  background: linear-gradient(135deg,#7c5cff,#36a3ff);
}

.user-avatar {
  background: #252932;
}

.message-content {
  line-height: 1.55;
  font-size: 16px;
  padding-top: 4px;
  white-space: pre-wrap;
}

.user-message {
  justify-content: flex-end;
}

.user-message .message-content {
  background: #1b1f28;
  padding: 11px 15px;
  border-radius: 18px;
  max-width: 80%;
}

/* WELCOME */

.welcome {
  max-width: 760px;
  margin: 12vh auto 40px;
  text-align: center;
}

.welcome h1 {
  font-size: clamp(38px, 10vw, 64px);
  letter-spacing: -2px;
  margin-bottom: 12px;
  background: linear-gradient(90deg,#fff,#9da7ff);
  -webkit-background-clip: text;
  color: transparent;
}

.welcome p {
  color: #8f96a3;
  font-size: 17px;
}

/* INPUT */

.input-area {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 12px 14px 18px;
  background: linear-gradient(transparent,#080a0f 35%);
}

.input-box {
  max-width: 760px;
  margin: auto;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 8px;
  background: #151820;
  border: 1px solid #30343e;
  border-radius: 20px;
  box-shadow: 0 10px 40px rgba(0,0,0,.35);
}

textarea {
  flex: 1;
  resize: none;
  border: none;
  outline: none;
  background: transparent;
  color: white;
  font-size: 16px;
  padding: 9px 8px;
  max-height: 130px;
  font-family: inherit;
}

textarea::placeholder {
  color: #747b88;
}

.send {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  border: none;
  background: white;
  color: black;
  font-size: 19px;
  font-weight: bold;
}

.send:active {
  transform: scale(.94);
}

.typing {
  display: inline-flex;
  gap: 4px;
}

.typing span {
  width: 6px;
  height: 6px;
  background: #8f96a3;
  border-radius: 50%;
  animation: blink 1.2s infinite;
}

.typing span:nth-child(2) {
  animation-delay: .15s;
}

.typing span:nth-child(3) {
  animation-delay: .3s;
}

@keyframes blink {
  0%,80%,100% {
    opacity: .25;
  }
  40% {
    opacity: 1;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="logo">
      <div class="logo-icon">N</div>
      Nova
    </div>

    <button class="new-chat" onclick="newChat()">
      + Ny chatt
    </button>
  </header>

  <main class="chat" id="chat">

    <div class="welcome" id="welcome">
      <h1>Hej 👋</h1>
      <p>Jag är Nova. Vad vill du göra?</p>
    </div>

  </main>

  <div class="input-area">
    <div class="input-box">

      <textarea
        id="input"
        rows="1"
        placeholder="Skriv ett meddelande..."
        onkeydown="handleKey(event)"
      ></textarea>

      <button class="send" onclick="sendMessage()">
        ↑
      </button>

    </div>
  </div>

</div>

<script>

const input = document.getElementById("input");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");

function handleKey(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
}

function addMessage(text, user = false) {

  if (welcome) {
    welcome.style.display = "none";
  }

  const message = document.createElement("div");

  message.className =
    "message " + (user ? "user-message" : "");

  message.innerHTML = `

    <div class="avatar ${user ? "user-avatar" : "ai-avatar"}">
      ${user ? "Du" : "N"}
    </div>

    <div class="message-content"></div>

  `;

  message.querySelector(".message-content").textContent = text;

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;

  return message;
}

function showTyping() {

  const message = document.createElement("div");

  message.className = "message";

  message.innerHTML = `

    <div class="avatar ai-avatar">N</div>

    <div class="message-content">

      <div class="typing">
        <span></span>
        <span></span>
        <span></span>
      </div>

    </div>

  `;

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;

  return message;
}

async function sendMessage() {

  const text = input.value.trim();

  if (!text) return;

  input.value = "";

  addMessage(text, true);

  const typing = showTyping();

  await new Promise(resolve =>
    setTimeout(resolve, 900)
  );

  typing.remove();

  /*
    DEMOLÄGE

    I nästa steg kopplar vi denna funktion
    till en riktig AI-modell via en säker backend.
  */

  let answer =
    "Jag är Nova i demoläge just nu. " +
    "Nästa steg är att koppla mig till en riktig AI-modell.";

  if (text.toLowerCase().includes("hej")) {
    answer =
      "Hej! 👋 Jag är Nova. Vi håller på att bygga mig.";
  }

  if (text.toLowerCase().includes("vem är du")) {
    answer =
      "Jag är Nova — en egen AI-assistent som vi bygger tillsammans.";
  }

  addMessage(answer);
}

function newChat() {

  chat.innerHTML = `

    <div class="welcome" id="welcome">
      <h1>Hej 👋</h1>
      <p>Jag är Nova. Vad vill du göra?</p>
    </div>

  `;

}

</script>

</body>
</html>
